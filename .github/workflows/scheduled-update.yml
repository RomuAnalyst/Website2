name: Mise à jour quotidienne Quarto (HTML dans doc/)

on:
  schedule:
    - cron: '0 2 * * *' # 2h00 UTC chaque jour
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: latest

      - name: Mettre à jour le fichier Quarto du dossier IUT
        run: |
          # Remplacez 'ma-page.qmd' par le nom de votre fichier Quarto dans IUT/
          sed -i "s/date: .*/date: $(date +%Y-%m-%d)/" IUT/Autoweb/index.qmd

      - name: Générer le HTML pour le fichier IUT/ma-page.qmd dans doc/
        run: |
          quarto render IUT/Autoweb/index.qmd --output-dir docs/IUT/Autoweb

      - name: Générer le HTML pour index.qmd à la racine dans doc/
        run: |
          quarto render index.qmd --output-dir docs

      - name: Commit et push des fichiers HTML générés
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add docs/*.html
          git commit -m "Mise à jour automatique des fichiers HTML dans doc/ [skip ci]" || echo "Pas de modifications"
          git push
